name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
      - run: vp install --frozen-lockfile
      - run: vp lint
      - run: vp fmt --check .
      - run: vp run typecheck
      - run: vp run build
      - run: vp run test
      - name: Vet CLI
        run: make -C apps/cli vet
      - name: Test CLI
        run: make -C apps/cli test
      - name: Build CLI
        run: make -C apps/cli build

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
      url: https://makarima.xyz
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
      - run: vp install --frozen-lockfile
      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run deploy
      - name: Deploy landing Worker
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run deploy
      - name: Deploy dashboard Worker
        working-directory: apps/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run deploy

  binaries:
    runs-on: ubuntu-latest
    needs: deploy
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
      - name: Build
        working-directory: apps/cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o mt ./cmd/tunnel
          tar -czf "mt-${GOOS}-${GOARCH}.tar.gz" mt
          sha256sum "mt-${GOOS}-${GOARCH}.tar.gz" > "mt-${GOOS}-${GOARCH}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/cli/mt-*.tar.gz
            apps/cli/mt-*.tar.gz.sha256
